name: Build SEA binaries

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: claudetower-win-x64.exe
            native-artifact: keyring-native-win-x64.node
          - os: macos-latest
            artifact: claudetower-macos-arm64
            native-artifact: keyring-native-macos-arm64.node
          - os: ubuntu-latest
            artifact: claudetower-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - run: npm ci

      - name: Verify (lint + module boundary + display tests)
        run: npm run verify

      - name: Build SEA binary
        run: npm run build

      - name: Smoke test (--version / --help)
        shell: bash
        run: |
          ./dist/${{ matrix.artifact }} --version
          ./dist/${{ matrix.artifact }} --help

      # M38: credential-store가 SEA exe에서 실제로 동작하려면 exe와 같은 폴더에
      # keyring-native.node(네이티브 addon)가 반드시 함께 있어야 한다(process.dlopen
      # 우회 로딩, src/accounts/credential-store/index.js 참고) — 빌드가 그 파일을
      # 만들었는지 여기서 바로 확인한다(빌드가 성공했어도 파일이 없으면 배포 채널이
      # 조용히 깨진 채로 릴리스될 위험을 CI에서 미리 잡는다).
      # 2026-08-20: Account 기능은 Windows/macOS 전용으로 범위를 좁혀(credential-store/
      # index.js의 assertSupportedPlatform() 참고) Linux 빌드는 이 파일 자체를 만들지
      # 않는다(build-sea.js SUPPORTS_ACCOUNT_KEYRING) — 그래서 Linux에서는 이 확인을
      # 건너뛴다.
      - name: 네이티브 keyring 바이너리 생성 확인
        if: matrix.os != 'ubuntu-latest'
        shell: bash
        run: test -f dist/keyring-native.node

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

      # 릴리스 자산명은 install.ps1/install.sh가 다운로드할 때 기대하는 이름과 반드시
      # 일치해야 한다(플랫폼별 접미사 포함) — 실제 릴리스 발행(`gh release create`) 시
      # 이 워크플로우 아티팩트를 정확히 이 이름 그대로 첨부해야 한다. Linux는 위와 같은
      # 이유로 빌드하지 않으므로 업로드도 건너뛴다(matrix.native-artifact 자체가 Linux
      # 항목에는 정의돼 있지 않음).
      - uses: actions/upload-artifact@v7
        if: matrix.os != 'ubuntu-latest'
        with:
          name: ${{ matrix.native-artifact }}
          path: dist/keyring-native.node

  # .PRD/03_PHASES.md Phase 1 "진짜 제품" 체크리스트: "Account 모듈 코드(src/accounts/)가
  # 아예 존재하지 않아도(빈 디렉토리여도) Display 모듈이 완전히 독립적으로 동작함을 확인".
  # src/accounts/를 통째로 지운 뒤 Display 검증이 여전히 통과하는지 매 push마다 증명한다.
  verify-display-standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - run: npm ci

      - name: src/accounts/ 완전히 제거 (Account 모듈이 존재한 적 없다고 가정)
        run: rm -rf src/accounts

      - name: Display 모듈이 Account 모듈 없이도 완전히 독립적으로 동작하는지 확인
        run: npm run verify
